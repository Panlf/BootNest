spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/schedule?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
  jpa:
    database: MYSQL
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    database-platform: org.hibernate.dialect.MySQL5InnoDBDialect
  dynamic:
    thread-pool:
      enabled: true
      monitor:
        enabled: true
        interval: 5
        log:
          enabled: true

server:
  port: 8080

logging:
  level:
    com.boot.scheduled: INFO
    root: WARN

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs
